---
Name: sitetree-import-export-extensions
---
SilverStripe\CMS\Model\SiteTree:
  extensions:
    SiteTreeImportExportLockExtension: MadeCurious\SiteTreeImportExport\Extensions\SiteTreeLockExtension
    SiteTreeImportExportExportExtension: MadeCurious\SiteTreeImportExport\Extensions\SiteTreeExportExtension

SilverStripe\CMS\Controllers\CMSMain:
  extensions:
    SiteTreeImportExportExportActionExtension: MadeCurious\SiteTreeImportExport\Extensions\CMSMainExportActionExtension
    # updateDoAdd() half of the Add-New-Page import integration — see
    # CMSMainAddFormImportExtension's class doc for why this same extension class is also
    # attached to CMSMainAddForm below.
    SiteTreeImportExportAddFormImportExtension: MadeCurious\SiteTreeImportExport\Extensions\CMSMainAddFormImportExtension

SilverStripe\CMS\Forms\CMSMainAddForm:
  extensions:
    # updateFields() half — adds the upload field to the native Add-New-Page form.
    SiteTreeImportExportAddFormImportExtension: MadeCurious\SiteTreeImportExport\Extensions\CMSMainAddFormImportExtension

# Default mismatch handling — 'fail' aborts an export/import with a clear error the moment an
# unsupported relation shape or a class/field missing on the target site is encountered;
# 'best_effort' skips what doesn't match and records a warning instead. Override in project
# YAML, e.g.:
#   MadeCurious\SiteTreeImportExport\Serialization\SiteTreeExporter:
#     mismatch_behaviour: best_effort
MadeCurious\SiteTreeImportExport\Serialization\SiteTreeExporter:
  mismatch_behaviour: fail
