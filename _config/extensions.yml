---
Name: page-packer-extensions
---
SilverStripe\CMS\Model\SiteTree:
  extensions:
    PagePackerLockExtension: MadeCurious\PagePacker\Extensions\SiteTreeLockExtension
    PagePackerExportExtension: MadeCurious\PagePacker\Extensions\SiteTreeExportExtension

SilverStripe\CMS\Controllers\CMSMain:
  extensions:
    PagePackerExportActionExtension: MadeCurious\PagePacker\Extensions\CMSMainExportActionExtension
    # updateDoAdd() half of the Add-New-Page import integration — see
    # CMSMainAddFormImportExtension's class doc for why this same extension class is also
    # attached to CMSMainAddForm below.
    PagePackerAddFormImportExtension: MadeCurious\PagePacker\Extensions\CMSMainAddFormImportExtension
    # Supplies the link/visibility the project's CMSMain_Content.ss override needs to render the
    # "Content Export" tab — see docs/templates/CMSMain_Content.ss and
    # CMSMainContentExportTabExtension's own class doc.
    PagePackerContentExportTabExtension: MadeCurious\PagePacker\Extensions\CMSMainContentExportTabExtension

SilverStripe\CMS\Forms\CMSMainAddForm:
  extensions:
    # updateFields() half — adds the upload field to the native Add-New-Page form.
    PagePackerAddFormImportExtension: MadeCurious\PagePacker\Extensions\CMSMainAddFormImportExtension

# Default mismatch handling — 'fail' aborts an export/import with a clear error the moment an
# unsupported relation shape or a class/field missing on the target site is encountered;
# 'best_effort' skips what doesn't match and records a warning instead. Override in project
# YAML, e.g.:
#   MadeCurious\PagePacker\Serialization\SiteTreeExporter:
#     mismatch_behaviour: best_effort
MadeCurious\PagePacker\Serialization\SiteTreeExporter:
  mismatch_behaviour: fail
